name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # master, devEngines support

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # master, devEngines support

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: node -e "const f='./package.json',fs=require('fs'),p=JSON.parse(fs.readFileSync(f));p.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Build and zip
        run: |
          pnpm zip
          pnpm zip:chrome

      - name: Get tag annotation
        run: |
          # Use subject+body to exclude GPG/SSH signatures from signed tags
          SUBJECT=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          BODY=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          if [ -n "$BODY" ]; then
            printf '%s\n\n%s\n' "$SUBJECT" "$BODY" > tag_message.txt
          else
            echo "$SUBJECT" > tag_message.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: ${{ github.ref_name }}
          body_path: tag_message.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            .output/*-firefox.zip
            .output/*-chrome.zip
            .output/*-sources.zip

      - name: Submit to AMO
        if: ${{ env.FIREFOX_JWT_ISSUER != '' }}
        env:
          FIREFOX_EXTENSION_ID: maintab@connorgallopo.github.io
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: unlisted
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm wxt submit \
            --firefox-zip ".output/maintab-${VERSION}-firefox.zip" \
            --firefox-sources-zip ".output/maintab-${VERSION}-sources.zip"
